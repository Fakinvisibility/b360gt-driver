name: Bug 报告
description: 报告可重复的软件、安装或播放问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请使用 Security 页面的私密报告入口，不要创建公开 Issue。
        提交前请移除设备序列号、用户名、Token 和无关硬件信息。

  - type: input
    id: version
    attributes:
      label: b360gt 版本
      description: 请提供安装包版本或 commit SHA。
      placeholder: 1.0.0rc2-1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、内核或 Windows 版本，以及 Python 版本。
      placeholder: Arch Linux, Linux 7.x, Python 3.14
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: 安装方式
      placeholder: Arch PKGBUILD / pip editable / Windows portable
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 请提供最小、完整、可重复的命令和操作步骤。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为与错误文本
      description: 请粘贴文本，不要只提供截图。
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: b360gt probe 输出
      description: 移除序列号或其他隐私信息后提供。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已完全退出 MythCool 和其他可能占用屏幕的程序
          required: true
        - label: 已移除 Token、序列号、用户名和无关硬件信息
          required: true
        - label: 这不是尚未修复的安全漏洞
          required: true

name: 功能建议
description: 建议安全、可维护且与显示功能有关的改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户问题，而不是只描述实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 安全范围确认
      options:
        - label: 建议不包含固件升级、水泵、风扇或任意原始 USB/HID 命令
          required: true
